# Site settings
title: Šmakalová Photography
email: "contact@smakalova.art"
description: "Fine Art Photography"
url: "https://smakalova.art"
baseurl: ""
facebook_username: ""
twitter_username: ""
instagram_username: "smakalova.art"
github_username:  ""
deviantart_username: ""
flickr_username: ""
discus_shortname: ""
share: false

# Owner/author information
owner:
  name:   Smakalova Photography
  avatar: avatar.png
  favicon: favicon.ico
  info: photography portfolio

# Settings for comments helper
# Set 'provider' to the comment provider you want to use. (i.e.  Disqus, Intense Debate, livefyre, or Facebook Comments)
# Set 'provider' to false to turn commenting off globally.
#Set 'provider: false' to disable comments globally.
# Disable comments for individual pages/posts by specifying 'comments: false' in the page/post YAML Front Matter.
#
comments:
  provider: false

# Internal nav
nav:
  - PORTFOLIO: "/portfolio/"
  - ABOUT: "/about/"

# All translation keys
translations:
 # 404.html
  permalink: "/404.html"

# Server
destination:      	 ./_site
port:             	 4000


# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty
exclude: ["less","node_modules","Gruntfile.js","package.json","README.md"]

# SiteMap
sitemap:
    file: "/sitemap.xml"
    exclude:
        - "/atom.xml"
        - "/feed.xml"
        - "/feed/index.xml"
    include_posts:
        - "/writing/"
    change_frequency_name: "change_frequency"
    priority_name: "priority"
